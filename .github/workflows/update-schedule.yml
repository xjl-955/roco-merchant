name: Update merchant data

# 可靠性设计 v4：
# GitHub cron 丢点严重（实测连续 5 小时全部被跳过），两层对冲：
# 1. 高频 cron：每 5 分钟一次（丢点后下一次很快补上）
# 2. workflow_dispatch：可被外部心跳（cron-job.org 等）主动触发
# 脚本内置增量逻辑：内容无变化不提交，不会产生垃圾 commit。
# 预计月消耗 ~1700 分钟（免费额度 2000 分钟，够用）。

on:
  schedule:
    - cron: '*/5 * * * *'        # 全天每 5 分钟（UTC，= 北京 -8h）
    - cron: '5 1 * * *'          # 北京 09:05 档期表专项
  workflow_dispatch: {}          # 手动触发 / 外部心跳触发入口

permissions:
  contents: write

concurrency:
  group: update-merchant-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live rounds data
        run: node server/fetch-live.mjs

      - name: Fetch daily schedule from wiki
        # 档期表抓取：每天 4 次（北京 08:00 / 12:00 / 16:00 / 20:00 = UTC 00/04/08/12 点整点后首次运行）
        # 多 cron 触发时 event.schedule 恒为 '*/5 * * * *'，不能用它判断——改用 UTC 时间窗口
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5 1 * * *'
        run: |
          UTC_H=$(date -u +%H)
          UTC_M=$(date -u +%M)
          echo "当前 UTC 时间: $UTC_H:$UTC_M"
          case "$UTC_H" in
            00|04|08|12)
              # 整点后 10 分钟内执行（cron 延迟容错）
              if [ "$UTC_M" -lt 10 ]; then
                echo "档期抓取窗口 ✓（北京 08/12/16/20 点档期更新）"
                node server/fetch-schedule.mjs
              else
                echo "窗口已过（>10分钟），跳过"
              fi
              ;;
            *)
              echo "非档期抓取时间，跳过"
              ;;
          esac

      - name: Commit to self repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/live.json
          if [ -f public/schedule.json ]; then git add public/schedule.json; fi
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "chore: update merchant data ($(date -u +%F-%H:%M))"
            git push
          fi

      - name: Sync live.json to data repo
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: node server/sync-to-data-repo.mjs
