name: Update merchant data

# 可靠性设计 v3：
# GitHub cron 会大量丢点（实测 12/16/20 点整点触发几乎全部被跳过）。
# 改为全天每 20 分钟触发一次（北京 08:00-24:00 每个时刻都可能命中），
# 脚本内置增量逻辑：内容无变化不提交，不会产生垃圾 commit。
# 每天约 48 次运行 × 每次几分钟，远低于免费额度（2000 分钟/月）。

on:
  schedule:
    - cron: '*/20 * * * *'       # 全天每 20 分钟（UTC，= 北京 -8h）
    - cron: '5 1 * * *'          # 北京 09:05 档期表专项
  workflow_dispatch: {}          # 手动触发

permissions:
  contents: write

concurrency:
  group: update-merchant-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live rounds data
        run: node server/fetch-live.mjs

      - name: Fetch daily schedule from wiki
        if: github.event.schedule == '5 1 * * *'
        run: node server/fetch-schedule.mjs

      - name: Commit to self repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/live.json
          if [ -f public/schedule.json ]; then git add public/schedule.json; fi
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "chore: update merchant data ($(date -u +%F-%H:%M))"
            git push
          fi

      - name: Sync live.json to data repo
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: node server/sync-to-data-repo.mjs
