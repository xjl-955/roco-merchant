name: Update merchant data

# 可靠性设计：
# 1. 每轮开售后 3 个时间点重试（:12 / :27 / :42），GitHub cron 丢点时后续点能补上
# 2. 每次运行先抓后比对：数据无变化则不提交（脚本内置增量逻辑）
# 3. 档期表每天 09:05（北京）更新一次

on:
  schedule:
    # 北京 08:12/08:27/08:42、12:12/12:27/12:42、16:12/16:27/16:42、20:12/20:27/20:42
    - cron: '12,27,42 0,4,8,12 * * *'
    - cron: '5 1 * * *'          # 北京 09:05 档期表
  workflow_dispatch: {}          # 支持手动触发

permissions:
  contents: write

concurrency:
  group: update-merchant-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live rounds data
        run: node server/fetch-live.mjs

      - name: Fetch daily schedule from wiki
        if: github.event.schedule == '5 1 * * *'
        run: node server/fetch-schedule.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/live.json
          if [ -f public/schedule.json ]; then git add public/schedule.json; fi
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "chore: update merchant data ($(date -u +%F-%H:%M))"
            git push
          fi
